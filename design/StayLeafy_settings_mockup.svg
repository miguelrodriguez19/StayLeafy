<svg xmlns="http://www.w3.org/2000/svg" width="900" height="980" viewBox="0 0 900 980">
  <defs>
    <style>
      text{font-family:Roboto,Arial,sans-serif}.display{font-family:Lora,Georgia,serif;font-size:28px;font-weight:600}.subtitle{font-family:Lora,Georgia,serif;font-size:13px}.screen-title{font-family:Lora,Georgia,serif;font-size:22px;font-weight:600}.section{font-size:14px;font-weight:700}.label{font-size:12px;font-weight:600}.body{font-size:11px}.caption{font-size:9px}.chip{font-size:9px;font-weight:700}.micro{font-size:9px;font-weight:700}.button{font-size:10px;font-weight:700}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0E1A15" flood-opacity=".12"/></filter>
  </defs>

  <rect width="900" height="980" fill="#F7F3E9"/>
  <text x="60" y="50" class="display" fill="#1F2923">StayLeafy · Settings</text>
  <text x="60" y="78" class="subtitle" fill="#5D675F">Existing product settings, reorganized with the Botanical Calm visual identity.</text>

